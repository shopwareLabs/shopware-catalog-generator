name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - name: oxlint
              run: bunx oxlint

            - name: No unsafe casts
              run: bun run lint:no-cast

            - name: Dead code (knip)
              run: bun run lint:dead

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - name: Type check src + tests
              run: bun run typecheck:all

    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run check-format

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - name: Run tests
              run: bun test
